# Pages CMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, pick this repository, and edit
# the homepage text and images without touching code. Every save is a Git commit,
# and the GitHub Action rebuilds and republishes the site automatically.

media:
  input: src/assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, avif, svg, gif]

content:
  # ───────────────────────────── Homepage ─────────────────────────────
  - name: home
    label: Homepage
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: headline, label: Headline (line 1), type: string }
          - { name: headline_line2, label: Headline (line 2), type: string }
          - { name: subhead, label: Supporting text, type: text }
          - { name: badge_number, label: Badge number, type: string }
          - { name: badge_label, label: Badge label, type: string }
          - name: primary_cta
            label: Main button
            type: object
            fields: &link
              - { name: label, type: string }
              - { name: url, label: Link, type: string }
          - { name: secondary_cta, label: Second button, type: object, fields: *link }
          - { name: footnote, label: Footnote, type: text }
          - { name: image, label: Hero image (desktop), type: image }
          - { name: image_mobile, label: Hero image (phones — smaller copy, optional), type: image }
          - { name: image_cutout, label: Image has a transparent background (show without a frame), type: boolean }
          - { name: image_alt, label: Photo description (for screen readers), type: string }
          - name: trust_pills
            label: Trust pills
            type: object
            list: true
            fields:
              - { name: text, type: string }

      - name: stats
        label: Stat tiles
        type: object
        list: { min: 1, max: 8 }
        fields:
          - { name: value, label: Big number, type: string }
          - { name: label, type: string }
          - &color
            name: color
            label: Colour
            type: select
            options: { values: [violet, yellow, coral, sky, mint] }

      - name: finder
        label: Treatment finder
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - { name: intro, type: text }
          - { name: note, label: Disclaimer, type: text }
          - name: options
            label: Concerns
            type: object
            list: true
            fields:
              - { name: id, label: ID (lowercase, no spaces), type: string }
              - { name: concern, label: Button text, type: string }
              - { name: emoji, type: string }
              - *color
              - { name: recommended, label: Recommended treatment, type: string }
              - { name: summary, type: text }
              - { name: alternatives, type: string, list: true }
              - { name: url, label: Learn more link, type: string }

      - name: treatments
        label: Treatment cards
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - name: cards
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: string }
              - *color
              - { name: image, label: Card photo (transparent PNG/WebP cut-out, ~900px wide), type: image }
              - { name: image_alt, label: Photo description (for screen readers), type: string }
              - { name: items, label: Treatments listed, type: string, list: true }
              - { name: url, label: Learn more link, type: string }

      - name: why
        label: Why Optimax
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - name: items
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: text }
              - *color
              - { name: image, label: Image (transparent PNG/WebP, roughly square), type: image }
              - { name: image_alt, label: Image description (for screen readers), type: string }

      - name: journey
        label: Your journey
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - name: steps
            type: object
            list: true
            fields:
              - { name: title, type: string }
              - { name: text, type: text }

      - name: doctors
        label: Doctors section text
        description: Edit the doctor list itself under "Doctors".
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - { name: intro, type: text }
          - { name: link, type: object, fields: *link }

      - name: reviews
        label: Patient reviews
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - { name: rating_text, label: Rating line, type: string }
          - { name: link, type: object, fields: *link }
          - name: items
            label: Quotes (keep them short and from real reviews)
            type: object
            list: true
            fields:
              - { name: quote, type: text }
              - { name: name, type: string }
              - { name: photo, label: Reviewer photo (square; initial shows if empty), type: image }
              - { name: rating, label: Stars given (1–5), type: number, options: { min: 1, max: 5 } }

      - name: recognition
        label: Awards, panels & media
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - { name: awards_title, type: string }
          - name: awards
            label: Awards (logo with the award name shown underneath)
            type: object
            list: true
            fields:
              - { name: name, label: Award name (shown under the logo), type: string }
              - { name: logo, label: Award logo (transparent SVG/PNG/WebP, no caption text), type: image }
          - { name: panels_title, type: string }
          - name: panels
            label: Insurance panels
            type: object
            list: true
            fields: &logo
              - { name: name, type: string }
              - { name: logo, label: Logo (transparent PNG/WebP/SVG; name shows if empty), type: image }
          - { name: media_title, type: string }
          - { name: media, label: Media mentions, type: object, list: true, fields: *logo }

      - name: booking
        label: Booking form
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, type: string }
          - { name: intro, type: text }
          - { name: submit_label, label: Button text, type: string }
          - { name: success_title, label: Success heading, type: string }
          - { name: success_text, label: Success message, type: text }
          - { name: consent, label: Consent line, type: text }
          - { name: services, label: Service options, type: string, list: true }

  # ───────────────────────────── Doctors ─────────────────────────────
  - name: doctors
    label: Doctors
    description: Each doctor gets their own page at /doctor/<page-address>/
    type: file
    path: src/_data/doctors.json
    format: json
    fields:
      - name: list
        label: Doctors
        type: object
        list: true
        fields:
          - { name: name, type: string }
          - { name: slug, label: Page address (lowercase-with-dashes — don't change once live), type: string }
          - { name: title, label: Position, type: string }
          - { name: credentials, type: text }
          - { name: photo, label: Portrait (4:5, ~600×750), type: image }
          - *color
          - { name: specialties, label: Clinical interests, type: string, list: true }
          - { name: procedures, label: Treatments performed (use the treatment names), type: string, list: true }
          - { name: languages, label: Languages spoken, type: string, list: true }
          - { name: branches, label: Branches (branch page addresses, e.g. kuching), type: string, list: true }

  # ───────────────────────────── Branches ─────────────────────────────
  - name: branches
    label: Branches
    description: Each branch gets its own page at /branches/<page-address>/ and appears in every booking form.
    type: file
    path: src/_data/branches.json
    format: json
    fields:
      - name: regions
        type: object
        list: true
        fields:
          - { name: region, type: string }
          - name: branches
            type: object
            list: true
            fields:
              - { name: name, label: Short name (booking form), type: string }
              - { name: slug, label: Page address (don't change once live), type: string }
              - { name: full_name, label: Full name (page heading), type: string }
              - { name: area, label: Town / state label, type: string }
              - { name: address, type: text }
              - { name: tel, label: Phone, type: string }
              - { name: whatsapp, label: WhatsApp, type: string }
              - { name: email, type: string }
              - { name: fax, type: string }
              - { name: hours, label: Opening hours (one line each), type: string, list: true }
              - { name: note, label: Highlight note (optional), type: string }
              - { name: services, type: text }
              - { name: google_profile, label: Google Maps / Business Profile link, type: string }
              - { name: waze, label: Waze link (optional), type: string }

  # ───────────────────────────── Site settings ─────────────────────────────
  - name: site
    label: Site settings (top bar, menu, footer)
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: name, label: Site name, type: string }
      - { name: logo, label: Header logo (colour, on light background), type: image }
      - { name: logo_footer, label: Footer logo (white, on dark background), type: image }
      - { name: favicon, label: Browser tab icon (square SVG or PNG), type: image }
      - { name: apple_touch_icon, label: Phone home-screen icon (180×180 PNG), type: image }
      - { name: seo_title, label: Browser tab / Google title, type: string }
      - { name: seo_description, label: Google description, type: text }
      - name: topbar
        label: Top bar
        type: object
        fields:
          - { name: hotline, type: string }
          - { name: whatsapp, label: WhatsApp (display), type: string }
          - { name: whatsapp_link, label: WhatsApp link (https://wa.me/60…), type: string }
          - { name: hours, type: string }
          - { name: listing, label: Listing text, type: string }
      - name: nav
        label: Menu links
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, label: Link, type: string }
          - { name: mega, label: Show treatments drop-down, type: boolean }
      - { name: nav_cta, label: Menu button, type: object, fields: *link }
      - { name: form_endpoint, label: Form endpoint URL (optional — e.g. Formspree, Make, Zapier webhook), type: string }
      - name: footer
        type: object
        fields:
          - { name: company, type: string }
          - { name: registration, label: Company registration no., type: string }
          - { name: address_label, type: string }
          - { name: address, type: text }
          - { name: links, type: object, list: true, fields: *link }
          - { name: legal_links, label: Legal links, type: object, list: true, fields: *link }
          - { name: legal, label: Small print, type: text }

  # ───────────────────────────── Treatments ─────────────────────────────
  - name: treatments
    label: Treatments
    description: The Treatments overview page and one page per treatment (/<page-address>/).
    type: file
    path: src/_data/treatments.json
    format: json
    fields:
      - name: overview
        label: Treatments overview page
        type: object
        fields:
          - { name: seo_title, label: Browser tab / Google title, type: string }
          - { name: seo_description, label: Google description, type: text }
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Headline (line 1), type: string }
          - { name: title_line2, label: Headline (line 2), type: string }
          - { name: subhead, label: Supporting text, type: text }
          - { name: intro_title, type: string }
          - { name: intro_text, type: text }
          - { name: suitable, label: Often suitable, type: string, list: true }
          - { name: not_suitable, label: May not be suitable, type: string, list: true }
          - name: groups
            type: object
            list: true
            fields:
              - { name: id, label: ID (laser / presbyopia / cataract / lenses), type: string }
              - { name: title, type: string }
              - { name: text, type: string }
              - *color
          - name: screening
            label: Screening & children's care
            type: object
            fields:
              - { name: eyebrow, type: string }
              - { name: title, type: string }
              - { name: text, type: text }
              - { name: items, type: object, list: true, fields: [ { name: emoji, type: string }, { name: title, type: string }, { name: text, type: text }, *color ] }
      - name: list
        label: Treatment pages
        type: object
        list: true
        fields:
          - { name: name, label: Full name, type: string }
          - { name: short, label: Short name (menu & cards), type: string }
          - { name: slug, label: Page address (don't change once live), type: string }
          - { name: aliases, label: Other names (so tags link here), type: string, list: true }
          - { name: group, type: select, options: { values: [laser, presbyopia, cataract, lenses] } }
          - *color
          - { name: service, label: Booking form service to pre-select, type: string }
          - { name: image, label: Hero photo (transparent cut-out), type: image }
          - { name: image_alt, label: Photo description, type: string }
          - { name: seo_title, label: Browser tab / Google title, type: string }
          - { name: seo_description, label: Google description, type: text }
          - { name: card, label: Card summary, type: object, fields: [ { name: summary, type: string }, { name: age, type: string }, { name: suited, label: Best for, type: string } ] }
          - name: hero
            type: object
            fields:
              - { name: eyebrow, type: string }
              - { name: title, type: string }
              - { name: title_line2, label: Tagline, type: string }
              - { name: subhead, type: text }
              - { name: badge_number, type: string }
              - { name: badge_label, type: string }
          - { name: facts, label: Fact tiles, type: object, list: { max: 4 }, fields: [ { name: value, type: string }, { name: label, type: string }, *color ] }
          - { name: what, label: What is it, type: object, fields: [ { name: title, type: string }, { name: text, type: text }, { name: features, type: string, list: true } ] }
          - { name: suits, label: Often a good fit, type: string, list: true }
          - { name: not_suits, label: May not be suitable, type: string, list: true }
          - { name: not_suits_note, label: Alternative note (optional), type: string }
          - name: compare
            label: Comparison table
            type: object
            fields:
              - { name: title, type: string }
              - { name: columns, label: Column headings (this treatment first), type: string, list: true }
              - { name: rows, type: object, list: true, fields: [ { name: label, type: string }, { name: values, label: Values (same order as columns), type: string, list: true } ] }
          - name: steps
            label: Procedure steps
            type: object
            fields:
              - { name: title, type: string }
              - { name: note, type: string }
              - { name: items, type: object, list: true, fields: [ { name: title, type: string }, { name: text, type: text }, { name: image, label: Illustration (optional), type: image } ] }
          - { name: lenses, label: Lens options (cataract only), type: object, fields: [ { name: title, type: string }, { name: intro, type: text }, { name: items, type: object, list: true, fields: [ { name: title, type: string }, { name: text, type: text }, *color ] } ] }
          - { name: care, label: Before & after, type: object, fields: [ { name: before, type: string, list: true }, { name: after, type: string, list: true } ] }

  # ───────────────────────────── About ─────────────────────────────
  - name: about
    label: About page
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: seo_title, label: Browser tab / Google title, type: string }
      - { name: seo_description, label: Google description, type: text }
      - { name: hero, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: title_line2, type: string }, { name: subhead, type: text }, { name: image, type: image }, { name: image_alt, type: string } ] }
      - { name: stats, type: object, list: true, fields: [ { name: value, type: string }, { name: label, type: string }, *color ] }
      - { name: story, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: paragraphs, type: text, list: true }, { name: image, type: image }, { name: image_alt, type: string } ] }
      - { name: timeline, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: intro, type: text }, { name: items, type: object, list: true, fields: [ { name: era, type: string }, { name: title, type: string }, { name: text, type: text }, *color ] } ] }
      - { name: people, label: People first, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: text, type: text }, { name: items, type: object, list: true, fields: [ { name: emoji, type: string }, { name: title, type: string }, { name: text, type: text }, *color ] } ] }
      - { name: warranty, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: text, type: text } ] }

  # ───────────────────────────── FAQs ─────────────────────────────
  - name: faqs
    label: FAQs page
    type: file
    path: src/_data/faqs.json
    format: json
    fields:
      - { name: seo_title, type: string }
      - { name: seo_description, type: text }
      - { name: eyebrow, type: string }
      - { name: title, type: string }
      - { name: title_line2, type: string }
      - { name: subhead, type: text }
      - name: groups
        label: Topics
        type: object
        list: true
        fields:
          - { name: id, label: ID (lowercase, no spaces), type: string }
          - { name: title, type: string }
          - { name: emoji, type: string }
          - *color
          - { name: items, label: Questions, type: object, list: true, fields: [ { name: q, label: Question, type: string }, { name: a, label: Answer, type: text } ] }

  # ───────────────────────────── Financing ─────────────────────────────
  - name: financing
    label: Financing page
    type: file
    path: src/_data/financing.json
    format: json
    fields:
      - { name: seo_title, type: string }
      - { name: seo_description, type: text }
      - { name: eyebrow, type: string }
      - { name: title, type: string }
      - { name: title_line2, type: string }
      - { name: subhead, type: text }
      - { name: plans, label: Instalment tiles, type: object, list: true, fields: [ { name: value, type: string }, { name: label, type: string }, *color ] }
      - { name: plans_note, type: text }
      - { name: value, label: What's included, type: object, fields: [ { name: eyebrow, type: string }, { name: title, type: string }, { name: intro, type: text }, { name: items, type: object, list: true, fields: [ { name: emoji, type: string }, { name: title, type: string }, { name: text, type: text }, *color ] } ] }
      - { name: faqs, type: object, list: true, fields: [ { name: q, label: Question, type: string }, { name: a, label: Answer, type: text } ] }

  # ───────────────────────────── Blog ─────────────────────────────
  - name: blog
    label: Blog
    description: Each post gets its own page at /<page-address>/
    type: file
    path: src/_data/blog.json
    format: json
    fields:
      - { name: seo_title, type: string }
      - { name: seo_description, type: text }
      - { name: eyebrow, type: string }
      - { name: title, type: string }
      - { name: title_line2, type: string }
      - { name: subhead, type: text }
      - name: posts
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: slug, label: Page address (don't change once live), type: string }
          - { name: date, type: date }
          - { name: categories, type: string, list: true }
          - *color
          - { name: emoji, label: Cover emoji, type: string }
          - { name: excerpt, type: text }
          - { name: body, label: Article, type: rich-text }

  # ───────────────────────────── Legal ─────────────────────────────
  - name: legal
    label: Privacy & Terms pages
    type: file
    path: src/_data/legal.json
    format: json
    fields:
      - name: privacy
        label: Privacy Policy
        type: object
        fields: &legaldoc
          - { name: slug, label: Page address, type: string }
          - { name: title, type: string }
          - { name: seo_description, type: text }
          - { name: updated, label: Last updated, type: string }
          - { name: intro, type: text }
          - { name: sections, type: object, list: true, fields: [ { name: title, type: string }, { name: body, type: rich-text } ] }
      - { name: terms, label: Terms of Use, type: object, fields: *legaldoc }

