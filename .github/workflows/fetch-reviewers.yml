name: One-off - fetch reviewer photos
on:
  push:
    paths: [".github/workflows/fetch-reviewers.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p reviewers-raw && cd reviewers-raw
          B=https://optimaxeyespecialist.com/cms/wp-content/uploads/ChIJE9solTpJzDER1jU1c2imPnE_
          curl -fsS -A "Mozilla/5.0" -o nassar.jpg    ${B}e6c138ae1351af14703ca490980ad6d7.jpg
          curl -fsS -A "Mozilla/5.0" -o rachel.jpg    ${B}6bc55658a7f299d5fcbd62944b7801cf.jpg
          curl -fsS -A "Mozilla/5.0" -o alqi.jpg      ${B}6109f363041ece7a534e35443b731e69.jpg
          curl -fsS -A "Mozilla/5.0" -o faris.jpg     ${B}2038a18c9aa219af6ae08280a043d5b8.jpg
          curl -fsS -A "Mozilla/5.0" -o emily.jpg     ${B}1797b2957a4d8492582df8e206d5e9bc.jpg
          curl -fsS -A "Mozilla/5.0" -o souloasis.jpg ${B}890b9029fd9d89e0258dbd5ff3ebf9bc.jpg
          ls -la
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviewers-raw && git commit -m "Fetch reviewer photos" && git push
